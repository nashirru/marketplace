<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Resi Template</title>
    <style>
        @page {
            margin: 4mm;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', 'Arial', sans-serif;
            font-size: 10pt;
            margin: 0;
            padding: 0;
            padding-right: 16pt; /* ruang untuk no pesanan vertikal di kanan */
            color: #000;
        }

        /* ===== WRAPPER UTAMA ===== */
        .resi-box {
            border: 2px solid #000;
            padding: 0;
            width: 100%;
            page-break-inside: auto;
        }

        /* ===== SECTION: PENGIRIM ===== */
        .section-pengirim {
            padding: 5px 7px;
            border-bottom: 2px solid #000;
            font-size: 10pt;
            font-weight: bold;
        }

        /* ===== SECTION: PENERIMA ===== */
        .section-penerima {
            padding: 5px 7px;
            border-bottom: 2px solid #000;
        }
        .penerima-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .penerima-table td {
            padding: 1px 2px;
            font-size: 10pt;
            vertical-align: top;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .label-col     { width: 18%; font-weight: bold; }
        .sep-col       { width: 3%;  font-weight: bold; }
        .value-col     { width: 79%; font-weight: bold; }
        .value-address { font-weight: normal; }
        .full-address { padding-left: 0; }

        /* ===== SECTION: CATATAN ===== */
        .section-catatan {
            padding: 4px 7px;
            border-bottom: 1px solid #ccc;
            font-size: 10pt;
        }

        /* ===== SECTION: TANGGAL & NOMOR ORDER ===== */
        .section-meta {
            width: 100%;
            border-collapse: collapse;
            border-bottom: 2px solid #000;
        }
        .meta-date {
            padding: 3px 7px;
            font-size: 10pt;
            border-right: 1px solid #000;
            vertical-align: middle;
            width: 55%;
        }
        .meta-order {
            padding: 3px 7px;
            font-size: 10pt;
            font-weight: bold;
            vertical-align: middle;
            text-align: center;
            width: 45%;
        }

        /* ===== SECTION: PRODUK TABLE ===== */
        .product-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .product-table thead tr {
            border-bottom: 1px solid #000; /* hanya garis pemisah judul vs isi */
        }
        .product-table thead th {
            padding: 3px 5px;
            font-size: 10pt;
            font-weight: bold;
            text-align: left;
        }
        .product-table thead th.col-no     { width: 8%; }
        .product-table thead th.col-produk { width: 80%; }
        .product-table thead th.col-qty    { width: 12%; text-align: center; }

        .product-table tbody td {
            padding: 3px 5px;
            font-size: 10pt;
            font-weight: normal;
            vertical-align: top;
            word-wrap: break-word;
            overflow-wrap: break-word;
            border: none;
        }
        .product-table tbody td.col-no     { text-align: left;   width: 8%; font-weight: normal; }
        .product-table tbody td.col-produk { width: 80%; font-weight: bold; }
        .product-table tbody td.col-qty    { text-align: center; width: 12%; font-weight: bold; }

        /* ===== NOMOR ORDER VERTIKAL DI KANAN ===== */
        .page-vertical,
        .page-vertical-atas {
            position: fixed;
            right: -11mm;
            -webkit-transform: rotate(-90deg);
            -moz-transform:    rotate(-90deg);
            transform:         rotate(-90deg);
            white-space: nowrap;
            font-family: 'Tahoma', 'Arial', sans-serif;
            font-size: 10pt;
            font-weight: bold;
            color: #000;
            letter-spacing: 0.5pt;
        }
        .page-vertical { top: 11%;
        margin: -3pt; }
        .page-vertical-atas { top: 22mm; } /* tetap setelah area pengirim+penerima */

        /* ===== PAGING: Pastikan tabel produk bisa lanjut ke page berikutnya ===== */
        .product-table { page-break-inside: auto; }
        .product-table thead { display: table-header-group; }
        .product-table tfoot { display: table-footer-group; }
        .product-table tr { page-break-inside: avoid; page-break-after: auto; }
    </style>
</head>
<body>

<div class="resi-box">

    <!-- PENGIRIM -->
    <div class="section-pengirim">
        <strong>Pengirim &nbsp;: {{NAMA_PENGIRIM}} ({{HP_PENGIRIM}})</strong>
    </div>

    <!-- PENERIMA -->
    <div class="section-penerima">
        <table class="penerima-table">
            <tr>
                <td class="label-col"><strong>Penerima</strong></td>
                <td class="sep-col"><strong>:</strong></td>
                <td class="value-col">{{PENERIMA_NAMA}}</td>
            </tr>
            <tr>
                <td class="label-col"><strong>No. Hp</strong></td>
                <td class="sep-col"><strong>:</strong></td>
                <td class="value-col">{{PENERIMA_HP}}</td>
            </tr>
            <tr>
                <td class="value-address full-address" colspan="3">{{PENERIMA_ALAMAT}}</td>
            </tr>
        </table>
    </div>

    <div class="page-vertical-atas">{{ORDER_NUMBER}}</div>

    <!-- CATATAN -->
    <div class="section-catatan">
        {{CATATAN_PESANAN}}
    </div>

    <!-- TANGGAL & NOMOR ORDER -->
    <table class="section-meta" cellpadding="0" cellspacing="0">
        <tr>
            <td class="meta-date">{{ORDER_DATE}}</td>
            <td class="meta-order"><strong>#{{ORDER_NUMBER}}</strong></td>
        </tr>
    </table>

    <!-- TABEL PRODUK -->
    <table class="product-table" cellpadding="0" cellspacing="0">
        <thead>
            <tr>
                <th class="col-no">No.</th>
                <th class="col-produk">Nama Produk</th>
                <th class="col-qty">Qty</th>
            </tr>
        </thead>
        <tbody>
            {{PRODUK_ITEMS}}
        </tbody>
    </table>

    <!-- FOOTER NO PESANAN -->
    <div style="padding: 6px 7px; border-top: 2px dashed #000; font-size: 11pt; font-weight: bold; text-align: center; letter-spacing: 1px;">
        #{{ORDER_NUMBER}}
    </div>

</div>

{{PAGE_VERTICAL}}

</body>
</html>
